name: 주간 잔여석 리포트

on:
  schedule:
    - cron: "0 6 21,28 10 *"
    - cron: "55 14 30 10 *"
  workflow_dispatch:
    inputs:
      all:
        description: "전체 기간으로 그리기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install pandas matplotlib
      - name: 그래프 생성
        run: |
          if [ "${{ github.event.schedule }}" = "55 14 30 10 *" ] || [ "${{ inputs.all }}" = "true" ]; then
            python report.py --all
          else
            python report.py
          fi
      - name: 커밋
        run: |
          git config user.name "parking-bot"
          git config user.email "parking-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "report: $(TZ=Asia/Seoul date '+%Y-%m-%d') KST"
          git pull --rebase
          git push
